name: vehicle_care
description: 'Vehicle Care & Maintenance Tracker - premium multi-vehicle maintenance, fuel and expense tracker.'
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3
  hooks_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend (opt-in at runtime)
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0

  # Local storage / offline-first
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  shared_preferences: ^2.3.3

  # UI / animation
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.2

  # Reporting
  pdf: ^3.11.1
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  web: ^1.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  disable_battery_optimization: ^1.1.2

  cupertino_icons: ^1.0.8
  file_picker: ^12.0.0
  geolocator: ^14.0.3
  open_filex: ^4.7.0
  firebase_auth: ^5.7.0
  connectivity_plus: ^7.3.1
  google_sign_in: ^7.2.0
  firebase_remote_config: ^5.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  sentry_flutter: 9.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  sentry_dart_plugin: ^3.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VF.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-VF.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400

flutter_launcher_icons:
  image_path: assets/icon/vehicle_care_icon.png
  android: launcher_icon
  adaptive_icon_background: '#0A0E14'
  adaptive_icon_foreground: assets/icon/vehicle_care_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/vehicle_care_icon_foreground.png
  min_sdk_android: 23
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/vehicle_care_icon.png
    background_color: '#0A0E14'
    theme_color: '#22D3EE'

# Uploads debug symbols and source maps to Sentry, so a release stack trace is
# readable instead of a list of addresses. Run after a build:
#
#   flutter build appbundle --obfuscate --split-debug-info=build/symbols
#   dart run sentry_dart_plugin
#
# **The auth token is never written here.** The plugin reads SENTRY_AUTH_TOKEN
# from the environment; an organisation token from
# https://sentry.io/settings/auth-tokens/ already carries the right scopes.
# org and project below are slugs, not the numeric ids in the DSN, and are not
# secret.
sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: vehicle-care
  org: free-hz
