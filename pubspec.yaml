name: vehicle_care
description: 'Vehicle Care & Maintenance Tracker - premium multi-vehicle maintenance, fuel and expense tracker.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3
  hooks_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend (opt-in at runtime)
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0

  # Local storage / offline-first
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  shared_preferences: ^2.3.3

  # UI / animation
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.2

  # Reporting
  pdf: ^3.11.1
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  web: ^1.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  cupertino_icons: ^1.0.8
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VF.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-VF.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400

flutter_launcher_icons:
  image_path: assets/icon/vehicle_care_icon.png
  android: launcher_icon
  adaptive_icon_background: "#0A0E14"
  adaptive_icon_foreground: assets/icon/vehicle_care_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/vehicle_care_icon_foreground.png
  min_sdk_android: 23
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/vehicle_care_icon.png
    background_color: "#0A0E14"
    theme_color: "#22D3EE"
