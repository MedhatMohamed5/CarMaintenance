org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# disable_battery_optimization pulls in com.afollestad:material-dialogs
# 0.9.6.0 for its own confirmation dialog, which predates AndroidX and
# depends on the legacy com.android.support:support-compat. Without
# jetifying it, that legacy support-compat collides class-for-class with
# androidx.core on a release build (checkReleaseDuplicateClasses fails).
android.enableJetifier=true
