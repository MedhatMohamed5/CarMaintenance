org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin incremental compilation off. Plugin sources live in the pub cache on
# C: and Flutter builds them into build/ on E:; Kotlin 2.4's incremental caches
# store paths relative to one root and fail across drives on Windows ("Could
# not close incremental caches" in every plugin's compileReleaseKotlin).
# A release build recompiles nearly everything anyway, so little is lost.
kotlin.incremental=false
