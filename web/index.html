<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vehicle Care - multi-vehicle maintenance, fuel and expense tracking.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vehicle Care">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vehicle Care</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Flutter web serves pubspec assets under assets/<pubspec-path>.
    CanvasKit/skwasm still need FontLoader (see AppFonts.ensureLoaded);
    these hints cover the HTML renderer and warm the browser cache.
  -->
  <link rel="preload" href="assets/assets/fonts/Cairo-VF.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/NotoSansArabic-VF.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Roboto-Regular.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'Cairo';
      src: url('assets/assets/fonts/Cairo-VF.ttf') format('truetype');
      font-weight: 200 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Noto Sans Arabic';
      src: url('assets/assets/fonts/NotoSansArabic-VF.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Roboto';
      src: url('assets/assets/fonts/Roboto-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0A0E14;
      font-family: 'Cairo', 'Noto Sans Arabic', 'Roboto', sans-serif;
    }
  </style>
</head>
<body>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
